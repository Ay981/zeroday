name: ZeroDay Nexus CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # --- STEP 1: SPIN UP A REAL POSTGRES + VECTOR ENGINE ---
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: zeroday_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # CRITICAL: Ensure pdo_pgsql is installed in the runner
          extensions: mbstring, dom, curl, libxml, pdo_pgsql 
          coverage: none

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # --- STEP 2: RUN THE AUDIT AGAINST THE SERVICE CONTAINER ---
      - name: Run Pest Security Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: zeroday_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
          # Ensure AI key check doesn't crash the test
          GEMINI_API_KEY: "fake-key-for-testing" 
        run: php artisan test

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}